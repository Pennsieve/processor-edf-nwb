# yaml-language-server: $schema=https://schemas.pennsieve.io/app-manifest/v1.json
schemaVersion: '1.0'
application:
  name: processor-edf-nwb
  description: Pennsieve workflow processor (Docker) converting EDF/EDF+ recordings to NWB with neuroconv
  type: processor
  maintainers:
    - name: Joost Wagenaar
      email: joostw@seas.upenn.edu
      orcid: 0009-0004-5925-5451
  tags:
    - eeg
    - electrophysiology
    - time-series
runtime:
  computeTypes:
    - standard
parameters:
  - name: DATA_REPRESENTATION
    type: string
    description: How ElectricalSeries samples are stored. Clinical EDF exporters autoscale each channel independently, giving a slightly different offset per channel, while an NWB ElectricalSeries stores only one scalar offset. physical_units folds each channel's gain and offset into the samples and stores float physical values, which is always safe. digital_counts keeps the raw integer samples and is only valid when every channel shares the same offset.
  - name: NON_NEURAL_CHANNELS
    type: string
    description: Comma-separated EDF signal labels to write as TimeSeries even though their physical dimension is a volt unit. Clinical exporters often stamp microvolts on respiratory effort, airflow, position, and DC auxiliary inputs. Signals whose dimension is not a volt unit become TimeSeries despite inclusion in this list.
  - name: TZ
    type: string
    description: IANA timezone name (e.g. America/New_York) used to interpret the EDF header's naive start time when writing session_start_time. Leave as UTC if the recording site is unknown. The header digits are preserved verbatim, so the timestamp can later be corrected by a uniform shift. How the start time was interpreted is recorded in the NWBFile data_collection field.
  - name: LOG_LEVEL
    type: string
    description: Verbosity of the processor's log. INFO logs each conversion step and the container's memory limit. DEBUG adds every signal's unit, rate, and destination, memory use at each step, and a progress line every 15 seconds, which tells a stopped or hung run from one killed for memory.
inputs:
  - name: EDF Timeseries
    description: European Data Format biosignal timeseries.
    mediaTypes:
      - application/vnd.pennsieve.edf
    required: true
outputs:
  - name: HDF5
    description: Hierarchical Data Format version 5.
    mediaTypes:
      - application/x-hdf5
